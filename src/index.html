<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Matcher</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <header class="hero">

        <h1>Job Matcher</h1>

        <p class="subtitle">
            Sube tu CV y encuentra las vacantes que mejor se adapten a tu perfil.
        </p>

    </header>

    <main class="dashboard">

        <!-- PANEL IZQUIERDO -->

        <aside class="sidebar">

            <section class="card">

                <h2>Subir CV</h2>

                <form id="searchForm">


                    <!-- ARREGLAR ESTO INPUT VERDE  -->
                    <label class="upload-area">

                        <input
                            id="pdfInput"
                            type="file"
                            accept=".pdf">

                        <span class="upload-icon">
                            <img 
                            src ="assets\document_icon.png" 
                            alt="Subir"
                            width="50"
                            >
                        </span>

                        <span class="upload-title">
                            Selecciona tu CV
                        </span>

                        <span class="upload-subtitle">
                            En formato PDF
                        </span>

                    </label>

                    <button
                        id="searchButton"
                        type="submit">

                        Analizar

                    </button>

                </form>

            </section>


            <section class="card">

                <h2>Análisis de IA:</h2>

                <div id="summary">

                    <div class="empty-summary">

                        <p>
                            Una vez completado, aparecerán aquí tus habilidades :)
                        </p>

                    </div>

                </div>

            </section>

        </aside>


        <!-- PANEL DERECHO -->

        <section class="content">

            <div class="results-header">

                <h2>Vacantes compatibles</h2>

                <span
                    class="job-counter"
                    id="jobCounter">

                    0 resultados

                </span>

            </div>

            <div
                id="results"
                class="results-grid">

            </div>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
